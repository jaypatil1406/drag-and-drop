
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Sorting</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Drag the fruits on their places</h1>

    <div class="scene">

        <div class="name-box" data-name="Apple">
            <p>Apple</p>
        </div>

        <div class="name-box" data-name="Watermelon">
            <p>Watermelon</p>
        </div>

        <div class="name-box" data-name="Grapes">
            <p>Grapes</p>
        </div>

        <div class="name-box" data-name="Pineapple">
            <p>Pineapple</p>
        </div>

        <div class="name-box" data-name="Strawberry">
            <p>Strawberry</p>
        </div>

        <div class="name-box" data-name="Orange">
            <p>Orange</p>
        </div>

        <div class="name-box" data-name="Banana">
            <p>Banana</p>
        </div>

    </div>

    <div class="bottom-box">

        <button id="left" type="button" aria-label="Previous fruits">◀️</button>

        <div class="fruit-window">

            <div class="fruit-list" id="fruitList">

                <div class="item">
                    <span class="fruit-icon">🍎</span>
                    <p>Apple</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍌</span>
                    <p>Banana</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍇</span>
                    <p>Grapes</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍊</span>
                    <p>Orange</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍓</span>
                    <p>Strawberry</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍍</span>
                    <p>Pineapple</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍉</span>
                    <p>Watermelon</p>
                </div>

                <div class="item">
                    <span class="fruit-icon">🍒</span>
                    <p>Cherry</p>
                </div>

            </div>

        </div>

        <button id="right" type="button" aria-label="Next fruits">▶️</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
